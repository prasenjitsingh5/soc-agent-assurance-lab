name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OPA_VERSION: v1.20.2

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,security]"
      - name: Install OPA
        run: |
          curl -sL -o /usr/local/bin/opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        run: mypy
      - name: Test
        run: pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Policy tests
        run: |
          if [ -d policies/rego ]; then opa test policies/rego -v; else echo "no policies yet"; fi
      - name: Security scan
        run: |
          bandit -q -r soclab -c pyproject.toml
          pip-audit --skip-editable
