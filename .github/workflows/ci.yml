name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OPA_VERSION: v1.20.2

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          version: "0.12.9"
          enable-cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev --extra security --extra providers
      - name: Install OPA
        run: |
          curl -sL -o /usr/local/bin/opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Policy tests
        run: |
          if [ -d policies/rego ]; then opa test policies/rego -v; else echo "no policies yet"; fi
      - name: Security scan
        run: |
          uv run bandit -q -r soclab -c pyproject.toml
          uv run pip-audit --skip-editable
      - name: Validate compose file
        run: |
          cp infrastructure/docker/postgres_password.example infrastructure/docker/postgres_password.local
          docker compose -f infrastructure/docker/docker-compose.yml config --quiet
      - name: Build API image
        run: docker build -f infrastructure/docker/api.Dockerfile -t soclab/api:ci .
