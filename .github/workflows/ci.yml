name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  OPA_VERSION: v1.20.2

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.9"
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --locked --extra dev --extra security --extra providers
      - name: Install OPA
        run: |
          curl -sL -o /usr/local/bin/opa "https://openpolicyagent.org/downloads/${OPA_VERSION}/opa_linux_amd64_static"
          chmod +x /usr/local/bin/opa
          opa version
      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Test
        run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Policy tests
        run: |
          if [ -d policies/rego ]; then opa test policies/rego -v; else echo "no policies yet"; fi
      - name: Security scan
        run: |
          uv run bandit -q -r soclab -c pyproject.toml
          uv run pip-audit --skip-editable
