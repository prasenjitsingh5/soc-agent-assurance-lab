version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /infrastructure/docker
    schedule:
      interval: weekly
    ignore:
      # Interpreter major and minor bumps get a compatibility run first, see CONTRIBUTING.
      - dependency-name: python
        update-types: [version-update:semver-major, version-update:semver-minor]
