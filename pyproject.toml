[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "soclab"
version = "0.1.0"
description = "Measures whether an AI SOC agent has earned operational authority: contextual authorization, adversarial testing, hash-chained evidence and a deployment recommendation."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Prasenjit Singh" }]
keywords = ["security", "soc", "policy", "opa", "evaluation", "llm-agents"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Typing :: Typed",
]
dependencies = [
    "fastapi==0.141.1",
    "pydantic==2.13.5",
    "httpx==0.28.1",
    "PyYAML==6.0.3",
    "SQLAlchemy==2.0.52",
    "Jinja2==3.1.6",
    "typer==0.27.2",
    "uvicorn[standard]==0.52.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "ruff==0.16.6",
    "mypy==2.3.1",
    "types-PyYAML==6.0.12.20260815",
    "httpx2==2.12.0",
]
security = [
    "bandit==1.9.4",
    "pip-audit==2.10.1",
    "cyclonedx-bom==7.3.1",
    "cyclonedx-python-lib==11.12.0",
    "lxml==6.1.3",
]
providers = [
    "anthropic>=1.3.0",
    "google-genai>=2.22.0",
    "openai>=3.8.0",
]
docker = [
    "psycopg[binary]>=3.3.5",
]
docs = [
    "mkdocs==1.6.1",
    "mkdocs-material==9.7.7",
    "pillow==12.3.0",
]

[project.urls]
Homepage = "https://github.com/prasenjitsingh5/soc-agent-assurance-lab"
Repository = "https://github.com/prasenjitsingh5/soc-agent-assurance-lab"
Changelog = "https://github.com/prasenjitsingh5/soc-agent-assurance-lab/blob/main/CHANGELOG.md"
Issues = "https://github.com/prasenjitsingh5/soc-agent-assurance-lab/issues"

[project.scripts]
soclab = "soclab.cli:app"

[tool.setuptools.packages.find]
include = ["soclab*"]

[tool.setuptools.package-data]
# Everything the CLI needs at runtime ships inside the wheel. tests/unit/test_package_data.py
# checks that every file under soclab/data matches one of these patterns.
soclab = ["py.typed", "simulator/fixtures/*.json", "reports/templates/*.j2"]
"soclab.data" = ["scenarios/attacks/*.yaml", "scenarios/incidents/*.yaml", "policies/*.rego"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
filterwarnings = [
    "error",
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
markers = [
    "policy: requires the opa binary",
    "smoke: requires the local docker stack",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W", "S", "N", "SIM"]
per-file-ignores = { "tests/**" = ["S101", "S106"] }

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["soclab"]
plugins = ["pydantic.mypy"]

[tool.coverage.run]
source = ["soclab"]
branch = true
